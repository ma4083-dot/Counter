const d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d(SALT),iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:d(IV)},key,d(DATA));
  return new TextDecoder().decode(buf);
}
async function tryPw(pw,silent){
  const btn=document.getElementById('go'),err=document.getElementById('err');
  btn.disabled=true;err.textContent=silent?'':'جاري التحقق...';
  try{
    const html=await unlock(pw);
    try{sessionStorage.setItem('_k',pw)}catch(e){}
    document.open();document.write(html);document.close();
  }catch(e){
    try{sessionStorage.removeItem('_k')}catch(_){}
    btn.disabled=false;
    if(!silent){err.textContent='كلمة السر غلط ❌';const i=document.getElementById('pw');i.value='';i.focus();}
    else err.textContent='';
  }
}
document.getElementById('go').onclick=()=>tryPw(document.getElementById('pw').value);
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')tryPw(e.target.value)});
try{const k=sessionStorage.getItem('_k');if(k)tryPw(k,true)}catch(e){}
</script>
